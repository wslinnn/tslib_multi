[package]
name = "tslib-jni"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Java JNI bindings for tslib"

[lib]
name = "tslib_jni"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
tslib-core = { path = "../tslib-core" }
tslib-audio = { path = "../tslib-audio" }
tslib-audio-aec3 = { path = "../tslib-audio-aec3" }
tslib-chat = { path = "../tslib-chat" }
tslib-channel = { path = "../tslib-channel" }
tokio = { workspace = true, features = ["rt-multi-thread"] }
openssl = { version = "0.10", features = ["vendored"], optional = true }
log = "0.4"
serde_json.workspace = true
android_logger = "0.14"
tracing-log = "0.2"

[features]
default = []
vendored-openssl = ["openssl"]
