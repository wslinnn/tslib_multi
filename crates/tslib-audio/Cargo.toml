[package]
name = "tslib-audio"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Audio module for tslib - voice capture, playback, and codec handling"

[dependencies]
tslib-core = { path = "../tslib-core" }

tokio.workspace = true
async-trait.workspace = true
futures.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
serde.workspace = true

# Audio
opus.workspace = true
cpal.workspace = true
rubato.workspace = true

# Ring buffer for audio
ringbuf = "0.3"

[build-dependencies]
# Compiles the vendored speexdsp echo canceller (speexdsp/)
cc = "1"

[dev-dependencies]
tracing-subscriber.workspace = true

[[bench]]
name = "jitter"
harness = false

[[bench]]
name = "allocations"
harness = false
