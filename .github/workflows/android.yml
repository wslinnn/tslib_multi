name: Android native build

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    name: Build libtslib_jni.so (arm64-v8a + x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Set up Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27.2.12479018

      # vendored OpenSSL needs perl+make+cmake — all present on ubuntu-latest
      - name: Build
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK: ${{ steps.ndk.outputs.ndk-path }}
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: |
          cargo ndk \
            -t arm64-v8a \
            -t x86_64 \
            -o dist/jniLibs \
            build --release -p tslib-jni --features vendored-openssl -j4
          ls -lh dist/jniLibs/*/libtslib_jni.so

      - uses: actions/upload-artifact@v4
        with:
          name: tslib-jni-android
          path: dist/jniLibs/*/libtslib_jni.so
          if-no-files-found: error
