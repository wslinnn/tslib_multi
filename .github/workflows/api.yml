name: API compatibility

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  semver:
    name: cargo-semver-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Compare the workspace against the merge base / previous commit so a
      # breaking public API change fails the job and must be documented in
      # docs/api-changes/v<version>.md.
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          baseline-rev: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'HEAD^' }}
          verbose: true
