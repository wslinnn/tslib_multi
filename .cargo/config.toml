[target.aarch64-linux-android]
linker = "aarch64-linux-android29-clang"
# Static C++ runtime for the vendored AEC3 (tslib-audio-aec3). The NDK's
# libc++.a is a thin archive, which rustc's rlib layer cannot ingest
# (`Unsupported archive identifier`), so it is linked as a plain linker
# argument instead of `-lstatic`: it only takes effect at the final cdylib
# link, where lld reads thin archives fine. The NDK clang driver searches
# the per-API sysroot dir itself, so no -L is needed.
rustflags = ["-C", "link-arg=-lc++"]

[target.armv7-linux-androideabi]
linker = "armv7a-linux-androideabi21-clang"

[target.x86_64-linux-android]
linker = "x86_64-linux-android29-clang"
rustflags = ["-C", "link-arg=-lc++"]
